<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet" href="css/estilos.css">

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .login-page {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .login-image {
    flex: 7;
  }

  .login-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .login-form {
    flex: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f5f5f5;
  }

  .form-card {
    background-color: #ffffff;
    padding: 30px 35px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .form-card h2 {
    margin: 0 0 10px 0;
    text-align: center;
  }

  .form-card input,
  .form-card select,
  .form-card button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #cccccc;
    box-sizing: border-box;
    font-size: 14px;
  }

  .form-card input:focus,
  .form-card select:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.15);
  }

  .form-card button {
    border: none;
    background-color: #007bff;
    color: #ffffff;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
  }

  .form-card button:hover {
    background-color: #0056b3;
  }
</style>

</head>

<body>

<div class="login-page">
  <div class="login-image">
    <img src="img/inicio.jpg" alt="Imagen de inicio de sesión">
  </div>

  <div class="login-form">
    <div class="form-card">
      <h2>Iniciar sesion</h2>

      <input id="correo" placeholder="Correo">

      <input id="contrasena" type="password" placeholder="Contrasena">

      <select id="rol">
        <option value="admin">Administrador</option>
        <option value="empleado">Empleado</option>
        <option value="cliente">Cliente</option>
      </select>

      <button onclick="login()">Ingresar</button>
    </div>
  </div>
</div>

<script>

function login(){

let rol=document.getElementById("rol").value;

if(rol=="admin")window.location="dashboard_admin.html";

if(rol=="empleado")window.location="dashboard_empleado.html";

if(rol=="cliente")window.location="dashboard_cliente.html";

}

</script>

</body>
</html>
